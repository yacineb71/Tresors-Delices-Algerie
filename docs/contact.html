<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles.css"> <!-- Example for CSS file -->
</head>
<body>
    <h1>Contact Us</h1>

    <div id="contact-info">
        <h2>Contact Information</h2>
        <p><strong>Address:</strong> 123 Street Name, City, Country</p>
        <p><strong>Phone:</strong> +1 (234) 567-8901</p>
        <p><strong>Email:</strong> info@example.com</p>
    </div>

    <div id="contact-form">
        <h2>Send Us a Message</h2>
        <form action="/submit-form" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Send</button>
        </form>
    </div>

    <div id="location-map">
        <h2>Our Location</h2>
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.8354345094265!2d144.9537363153181!3d-37.81720997975195!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f6c9ed3%3A0x5045675218cd1c0!2zMTIzIFN0cmVldCBOYW1lLCBDaXR5LCBDb3VudHJ5!5e0!3m2!1sen!2sau!4v1612345678902!5m2!1sen!2sau"
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </div>

    <div id="business-hours">
        <h2>Business Hours</h2>
        <p><strong>Monday to Friday:</strong> 9:00 AM - 5:00 PM</p>
        <p><strong>Saturday:</strong> 10:00 AM - 4:00 PM</p>
        <p><strong>Sunday:</strong> Closed</p>
    </div>
</body>
</html>
