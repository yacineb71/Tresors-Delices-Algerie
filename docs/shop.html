<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Products</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .product-card { border: 1px solid #ccc; border-radius: 5px; padding: 10px; text-align: center; }
        .product-card img { max-width: 100%; height: auto; }
        .product-name { font-size: 1.2em; }
        .product-description { font-size: 0.9em; color: #555; }
        .product-price { font-size: 1.5em; color: #000; }
        .add-to-cart { background-color: #28a745; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Shop Products</h1>
    <div class="product-grid">
        <!-- Example Product Card -->
        <div class="product-card">
            <img src="path/to/image1.jpg" alt="Product 1">
            <div class="product-name">Product 1</div>
            <div class="product-description">Description for product 1.</div>
            <div class="product-price">$19.99</div>
            <button class="add-to-cart">Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="path/to/image2.jpg" alt="Product 2">
            <div class="product-name">Product 2</div>
            <div class="product-description">Description for product 2.</div>
            <div class="product-price">$29.99</div>
            <button class="add-to-cart">Add to Cart</button>
        </div>
        <!-- More Product Cards... -->
    </div>
</body>
</html>
